<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page" id="firstPage">
    <h1>Will You Be Mine? ❤️</h1>
    <p>I have one very important question for you...</p>

    <div class="buttons">
      <button id="yesBtn">Yes ❤️</button>
      <button id="noBtn">No 😭</button>
    </div>
  </div>

  <div class="page" id="secondPage">
    <div class="heart">❤️</div>
    <h1>YAYYYYY! 🥰</h1>

    <p class="message">
      You just made me the happiest person ever! ❤️
      <br><br>
      I promise to always make you smile,
      annoy you a little 😜,
      and stay by your side. 💕
    </p>
  </div>

  <div class="signature">Shuvro Sarker</div>

  <script src="script.js"></script>
</body>
</html>
